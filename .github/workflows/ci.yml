name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # BSData — git submodule; без рекурсивного checkout тесты не видят
          # исходные даташиты и падают на этапе npm test.
          submodules: recursive
          fetch-depth: 1

      - name: Verify BSData checkout
        shell: bash
        run: |
          test -f 'public/BSData/wh40k-11e/Warhammer 40,000.json'
          echo "BSData submodule is available"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build site
        run: npm run build
