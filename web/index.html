<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080a0e" />
    <meta
      name="description"
      content="Аналитический тирлист Warhammer 40,000: тир по 12 сочетаниям «парадигма цели × режим боя», разбор урона и живучести, вклад способностей. Все метрики посчитаны движком сборки."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Тирлист Warhammer 40,000 — аналитический расчёт</title>
    <!--
      Одна гарнитура — IBM Plex, в трёх начертаниях: Regular для текста,
      Condensed для шапки, Mono для всех чисел. Разные шрифты для заголовков и
      таблицы здесь не работали: Cinzel с тонкими штрихами превращал шапку в
      свадебное приглашение, а на шестнадцати колонках цифр это просто мешало.

      Подключение в разметке, а не через @import: такой запрос встаёт в очередь
      после разбора таблицы стилей и задерживает первую отрисовку.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <p class="empty">Загрузка индекса тирлиста…</p>
    </div>
    <noscript>
      <p class="empty">
        Для просмотра тирлиста нужен JavaScript: индекс и разбор юнитов
        подгружаются по требованию.
      </p>
    </noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
